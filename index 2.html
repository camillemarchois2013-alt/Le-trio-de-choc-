<title>Le Trio de Choc – Recettes de desserts</title>
<style>
:root{--bg:#fff8f1;--card:#ffffff;--tx:#3b2418;--mu:#8a6a5a;--ac:#c2410c;--ac2:#f59e0b;--bd:#f1dccb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d130e;--card:#2a1c15;--tx:#fbeee3;--mu:#c7a898;--ac:#fb923c;--ac2:#fbbf24;--bd:#4a3228;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d130e;--card:#2a1c15;--tx:#fbeee3;--mu:#c7a898;--ac:#fb923c;--ac2:#fbbf24;--bd:#4a3228;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
header{text-align:center;padding:22px 16px 8px}
h1{margin:0;font-size:2rem;color:var(--ac)}
.sub{color:var(--mu);font-style:italic;margin:4px 0 0}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--bd);z-index:5}
nav a{white-space:nowrap;padding:8px 14px;border-radius:99px;text-decoration:none;color:var(--tx);border:1px solid var(--bd);background:var(--card);font-family:system-ui,sans-serif;font-size:.9rem}
nav a.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:760px;margin:0 auto;padding:16px}
h2{color:var(--ac);margin-top:4px}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:18px;padding:24px;text-align:center}
.hero h2{color:#fff;margin:0 0 6px}
.btn{display:inline-block;margin-top:10px;background:#fff;color:#c2410c;padding:10px 18px;border-radius:99px;text-decoration:none;font-family:system-ui,sans-serif;font-weight:600}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.card h3{margin:0 0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 12px;font-family:system-ui,sans-serif;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
details{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px}
summary{cursor:pointer;font-weight:bold;font-size:1.05rem}
.meta{color:var(--mu);font-family:system-ui,sans-serif;font-size:.85rem;margin:6px 0}
.ph{width:120px;height:120px;border-radius:50%;object-fit:cover;object-position:top;border:3px solid var(--ac);display:block;margin:0 auto 8px}
.avatar{width:96px;height:96px;display:block;margin:0 auto 8px}
.team .card{text-align:center}
.tag{display:inline-block;background:var(--bd);border-radius:6px;padding:1px 8px;font-size:.75rem;font-family:system-ui,sans-serif}
footer{text-align:center;color:var(--mu);padding:24px 16px;font-size:.85rem}
</style>
</head>
